name: Publish staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit already present on staging
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact staging commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          case "$RELEASE_SHA" in
            (*[!0-9a-f]*|"") echo "release_sha must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Enforce staging package identity
        run: |
          node --input-type=module <<'NODE'
          import manifest from "./package.json" with { type: "json" };
          if (!/-staging\.\d+$/.test(manifest.version)) {
            throw new Error(`not a staging version: ${manifest.version}`);
          }
          if (manifest.publishConfig?.tag !== "staging") {
            throw new Error("publishConfig.tag must be staging");
          }
          NODE

      - run: npm run validate
      - run: npm audit --audit-level=high
      - name: Publish the installed-smoke tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find .release-tmp/mcp-pack-smoke -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          test "$(tar -xOf "$TARBALL" package/package.json | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(body);
              if (
                manifest.bin?.["relay-mcp"]?.replace(/^\.\//, "")
                  !== "dist/cli.js"
              ) process.exit(1);
              process.stdout.write(manifest.version);
            });
          ')" = "0.1.0-staging.1"
          EXPECTED_INTEGRITY="sha512-$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            process.stdout.write(
              createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")
            );
          ' "$TARBALL")"
          if ACTUAL_INTEGRITY="$(
            npm view @relaymessenger/mcp@0.1.0-staging.1 dist.integrity 2>/dev/null
          )"; then
            test "$ACTUAL_INTEGRITY" = "$EXPECTED_INTEGRITY"
          else
            npm publish "$TARBALL" \
              --access public \
              --tag staging \
              --provenance
          fi

      - name: Verify the staging tag
        run: |
          for attempt in $(seq 1 12); do
            if test "$(npm view @relaymessenger/mcp@staging version 2>/dev/null || true)" \
              = "0.1.0-staging.1"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
